# Render.com FREE deployment configuration
# This file tells Render how to build and deploy your backend

services:
  - type: web
    name: malawieduhub-api
    env: node
    plan: free
    buildCommand: cd backend && npm install
    startCommand: cd backend && npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: malawieduhub-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: FRONTEND_URL
        value: https://malawi-edu-hub.vercel.app
      - key: PAYCHANGU_SECRET_KEY
        value: sec-test-WBkzHqND0w4kRJ4MBHQPqSLcJPmOMxtP
      - key: PAYCHANGU_PUBLIC_KEY
        value: pub-test-sHrctUFpd92KlxxqekxcZotoBgDpJuvc
      - key: BACKEND_URL
        value: https://malawieduhub-api.onrender.com
      # Add your other secrets in Render dashboard:
      # - AWS_ACCESS_KEY_ID
      # - AWS_SECRET_ACCESS_KEY
      # - PAYCHANGU_SECRET_KEY
      # - PAYCHANGU_PUBLIC_KEY

databases:
  - name: malawieduhub-db
    plan: free
    databaseName: malawieduhub
    user: malawieduhub
